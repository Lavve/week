<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Week</title>
    <link rel="stylesheet" href="css/popup.css" />
  </head>
  <body class="popup">
    <i></i><i></i>
    <div id="week-container">
      <p class="ext-name" id="ext-name"></p>
      <p id="week" aria-live="polite">&nbsp;</p>
      <p id="date" aria-live="polite">&nbsp;</p>
    </div>
    <div id="settings-container">
      <label>
        <p class="popup-label">Date format</p>
        <select class="popup-select" name="date-format">
          <option value="DD/MM/YYYY" selected>DD/MM/YYYY</option>
          <option value="MM/DD/YYYY">MM/DD/YYYY</option>
          <option value="YYYY/MM/DD">YYYY/MM/DD</option>
          <option value="DD-MM-YYYY">DD-MM-YYYY</option>
          <option value="MM-DD-YYYY">MM-DD-YYYY</option>
          <option value="YYYY-MM-DD">YYYY-MM-DD</option>
        </select>
      </label>
    </div>
    <footer class="popup-footer">
      <button type="button" class="popup-footer-button">
        <svg
          id="settings-icon"
          xmlns="http://www.w3.org/2000/svg"
          xml:space="preserve"
          style="fill-rule: evenodd; clip-rule: evenodd; stroke-linejoin: round; stroke-miterlimit: 2"
          viewBox="0 0 512 512"
          width="14"
          height="14"
          fill="var(--dimmed-text-color)"
        >
          <title>Settings</title>
          <path
            d="m56.74 20.89-1-2.31c3.33-7.53 3.11-7.75 2.46-8.41L54 6l-.42-.35h-.49c-.26 0-1 0-7.51 2.93l-2.38-1C40.09 0 39.77 0 38.87 0h-6c-.9 0-1.25 0-4.1 7.66l-2.37 1q-6.6-2.82-7.65-2.82h-.56l-4.58 4.49c-.7.65-.94.88 2.58 8.3l-1 2.3c-7.79 3-7.79 3.3-7.79 4.23v5.89c0 .92 0 1.25 7.82 4l1 2.29c-3.33 7.53-3.11 7.76-2.46 8.41L18 50l.42.37h.5c.25 0 1 0 7.5-3l2.38 1C31.9 56 32.21 56 33.12 56h6c.92 0 1.25 0 4.11-7.66l2.39-1c4.37 1.85 6.93 2.79 7.61 2.79h.57l4.62-4.52c.66-.66.89-.89-2.62-8.28l1-2.3c7.81-3 7.81-3.33 7.81-4.23v-5.87c-.04-.93-.04-1.25-7.87-4.04M36 37.8c-5.3-.108-9.6-4.497-9.6-9.798 0-5.376 4.424-9.8 9.8-9.8 5.375 0 9.799 4.423 9.8 9.798-.06 5.429-4.571 9.85-10 9.8"
            transform="translate(-60.034 10)scale(8.78838)"
          />
        </svg>
        <svg
          id="back-icon"
          xmlns="http://www.w3.org/2000/svg"
          xml:space="preserve"
          width="14"
          height="14"
          fill="none"
          stroke="var(--dimmed-text-color)"
          stroke-width="144.03"
          stroke-linecap="round"
          stroke-linejoin="round"
          stroke-miterlimit="1.5"
          viewBox="0 0 354 399"
        >
          <title>Back</title>
          <path
            d="M33.654 255.304c182.383.649 315.072.588 410.807 0"
            transform="translate(24.414 36.706)scale(.63646)"
          />
          <path d="M61.969 255.768 257.16 60.577" transform="rotate(90 48.814 199.208)scale(.78753)" />
          <path d="M61.969 255.768 257.16 60.577" transform="translate(-2.206 -1.873)scale(.78753)" />
        </svg>
      </button>
      <span class="version" aria-label="version"></span>
    </footer>
    <script src="js/week-utils.js"></script>
    <script src="js/week.js"></script>
  </body>
</html>
